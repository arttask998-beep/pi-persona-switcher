<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pi 人格控制台</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --line: #2a3040;
    --text: #e7eaf3;
    --muted: #8b93a7;
    --accent: #e11d48;
    --accent-2: #fb7185;
    --ok: #34d399;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 20% -10%, #1b2030 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.5 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: rgba(15,17,23,.82); backdrop-filter: blur(8px);
  }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .brand .ver { color: var(--muted); font-size: 12px; font-weight: 500; margin-left: 8px; }
  .status {
    flex: 1; min-width: 0; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .badge.on { color: var(--ok); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
  .badge.off { color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  button, a.btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); padding: 7px 12px; border-radius: 8px; cursor: pointer;
    font: inherit; text-decoration: none; transition: .15s ease;
  }
  button:hover, a.btn:hover { border-color: #3b4458; background: #242a3a; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #f43f5e; }
  button.danger { color: #fecdd3; border-color: rgba(225,29,72,.35); }
  button.danger:hover { background: rgba(225,29,72,.15); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0,1fr);
  }
  .list {
    min-height: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: rgba(23,26,35,.6);
  }
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; color: var(--muted); font-size: 12px; letter-spacing: .08em;
  }
  .list-head button { padding: 5px 10px; font-size: 12px; }
  #personas { flex: 1; overflow: auto; padding: 4px 10px 10px; }
  .card {
    border: 1px solid var(--line); background: var(--panel-2);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    transition: .15s ease;
  }
  .card:hover { border-color: #3b4458; transform: translateY(-1px); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(225,29,72,.35) inset; }
  .card .row1 { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .id { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pill {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid rgba(52,211,153,.35); color: var(--ok);
    background: rgba(52,211,153,.08);
  }
  .hint { padding: 10px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  .editor { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .editor-head {
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  #edTitle { font-size: 16px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .editor-actions { display: flex; gap: 8px; }
  textarea {
    flex: 1; min-height: 0; resize: none; border: 0; outline: 0;
    background: var(--panel); color: var(--text); padding: 18px 20px;
    font: 14px/1.7 ui-monospace, "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
  }
  textarea::placeholder { color: #5d6477; }
  .settings {
    border-top: 1px solid var(--line);
    padding: 10px 20px 12px;
    background: rgba(30, 34, 48, .55);
  }
  .settings-head {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 12px; letter-spacing: .08em; margin-bottom: 8px;
  }
  .settings-head button { padding: 4px 9px; font-size: 12px; }
  .settings-model {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 8px; font-size: 12px; color: var(--muted);
  }
  .settings-model label { display: flex; align-items: center; gap: 6px; }
  .settings-model select {
    max-width: 520px; padding: 6px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: inherit;
  }
  .settings-model-note { color: var(--muted); }
  .settings-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
    gap: 10px; align-items: end;
  }
  .settings label {
    display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: var(--muted);
  }
  .settings input[type=number] {
    width: 100%; padding: 6px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: inherit;
  }
  .settings label.check {
    flex-direction: row; align-items: center; gap: 6px;
    padding-bottom: 7px; color: var(--text);
  }
  .settings input[type=checkbox] { accent-color: var(--accent); }
  .settings-hint { margin-top: 7px; color: var(--muted); font-size: 12px; }
  .settings-msg { margin-top: 3px; font-size: 12px; min-height: 18px; }
  .settings-msg.ok { color: var(--ok); }
  .settings-msg.err { color: #fda4af; }
  .foot {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px; min-height: 38px;
  }
  #msg.ok { color: var(--ok); }
  #msg.err { color: #fda4af; }
  footer {
    padding: 8px 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 220px minmax(0,1fr); }
    .list { border-right: 0; border-bottom: 1px solid var(--line); }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Pi 人格控制台 <span class="ver" id="ver"></span></div>
    <div class="status"><span class="badge off" id="badge">加载中…</span><span id="statusText"></span></div>
    <div class="actions">
      <button id="refresh">刷新</button>
      <a class="btn" href="http://127.0.0.1:30141" target="_blank" rel="noreferrer">打开 pi-web</a>
    </div>
  </header>

  <main>
    <section class="list">
      <div class="list-head"><span>人格列表</span><button id="newBtn">+ 新建</button></div>
      <div id="personas"></div>
      <div class="hint">切换后，下一条消息立即生效；不需要 /reload，也不需要重启 pi-web。</div>
    </section>

    <section class="editor">
      <div class="editor-head">
        <div>
          <div id="edTitle">选择一个人格</div>
          <div class="sub" id="edSub">从左侧选择，或新建一个人格</div>
        </div>
        <div class="editor-actions">
          <button id="enableBtn" class="primary" disabled>启用</button>
          <button id="saveBtn" disabled>保存</button>
          <button id="deleteBtn" class="danger" disabled>删除</button>
        </div>
      </div>
      <textarea id="content" placeholder="在这里写人格设定，例如：&#10;你是 Pi，一个务实、直接的编程助手。&#10;- 先给结论，再给理由。&#10;- 不确定时明确说不知道。" disabled></textarea>
      <div class="settings">
        <div class="settings-head">
          <span>上下文压缩</span>
          <button id="resetSettings">恢复默认</button>
        </div>
        <div class="settings-model">
          <label>估算模型
            <select id="contextModel"></select>
          </label>
          <span class="settings-model-note">来自 models.json；只影响这里的估算，不会改动实际模型</span>
        </div>
        <div class="settings-grid">
          <label>reserveTokens
            <input id="reserveTokens" type="number" min="0" step="512" />
          </label>
          <label>keepRecentTokens
            <input id="keepRecentTokens" type="number" min="0" step="512" />
          </label>
          <label class="check"><input id="compactionEnabled" type="checkbox" /> 启用自动压缩</label>
          <button id="saveSettings" class="primary">保存阈值</button>
        </div>
        <div class="settings-hint" id="settingsHint"></div>
        <div class="settings-msg" id="settingsMsg"></div>
      </div>
      <div class="foot"><span id="count"></span><span id="msg"></span></div>
    </section>
  </main>

  <footer>数据目录：<span id="dir">-</span> · 仅监听 127.0.0.1 · 人格文件会追加到 Pi 的 system prompt</footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = {
    ver: $("ver"), badge: $("badge"), statusText: $("statusText"),
    personas: $("personas"), edTitle: $("edTitle"), edSub: $("edSub"),
    content: $("content"), count: $("count"), msg: $("msg"), dir: $("dir"),
    enableBtn: $("enableBtn"), saveBtn: $("saveBtn"), deleteBtn: $("deleteBtn"),
    refresh: $("refresh"), newBtn: $("newBtn"),
    reserveTokens: $("reserveTokens"), keepRecentTokens: $("keepRecentTokens"),
    compactionEnabled: $("compactionEnabled"), saveSettings: $("saveSettings"),
    resetSettings: $("resetSettings"), settingsHint: $("settingsHint"),
    settingsMsg: $("settingsMsg"), contextModel: $("contextModel"),
  };
  let state = null;
  let selectedId = null;
  let dirty = false;
  let busy = false;
  let compaction = null;
  let contextInfo = null;
  let contextWindow = 32768;

  async function api(method, url, body) {
    const res = await fetch(url, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function setMsg(text, kind) {
    el.msg.textContent = text || "";
    el.msg.className = kind || "";
  }

  function updateCount() {
    const text = el.content.value;
    const chars = [...text].length;
    el.count.textContent = `${chars} 字符 · 约 ${Math.ceil(chars / 2)} tokens`;
  }

  function setSettingsMsg(text, kind) {
    el.settingsMsg.textContent = text || "";
    el.settingsMsg.className = `settings-msg ${kind || ""}`;
  }

  function formatWindow(n) {
    if (!Number.isFinite(n) || n <= 0) return "?";
    if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(1)}M`;
    if (n >= 1000) return `${Math.round(n / 1024)}k`;
    return String(n);
  }

  function currentModelName() {
    const selected = contextInfo?.models?.find((m) => m.key === el.contextModel.value);
    return selected?.key ?? contextInfo?.model ?? "未知模型";
  }

  function updateSettingsHint() {
    const reserve = Number(el.reserveTokens.value);
    const keep = Number(el.keepRecentTokens.value);
    if (!Number.isFinite(reserve) || !Number.isFinite(keep)) {
      el.settingsHint.textContent = "输入两个整数阈值";
      return;
    }
    if (reserve >= contextWindow) {
      el.settingsHint.textContent = `reserveTokens 不能大于等于 ${contextWindow}，否则会立即触发压缩`;
      return;
    }
    const trigger = contextWindow - reserve;
    const pct = Math.max(0, Math.min(100, (trigger / contextWindow) * 100));
    const pctText = pct >= 99 ? pct.toFixed(1) : pct.toFixed(0);
    el.settingsHint.textContent =
      `按 ${currentModelName()} 的 ${formatWindow(contextWindow)} 窗口估算：触发点 ≈ ${trigger} tokens（${pctText}%）；最近保留 ${keep} tokens。`;
  }

  function populateContextModels(preferredKey) {
    const models = contextInfo?.models ?? [];
    el.contextModel.innerHTML = "";
    if (!models.length) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "未在 models.json 找到带 contextWindow 的模型";
      el.contextModel.appendChild(opt);
      el.contextModel.disabled = true;
      contextWindow = contextInfo?.contextWindow ?? 32768;
      return;
    }
    el.contextModel.disabled = false;
    for (const m of models) {
      const opt = document.createElement("option");
      opt.value = m.key;
      opt.textContent = `${m.key} · ${formatWindow(m.contextWindow)}`;
      el.contextModel.appendChild(opt);
    }
    const key = models.some((m) => m.key === preferredKey) ? preferredKey : models[0].key;
    el.contextModel.value = key;
    contextWindow =
      models.find((m) => m.key === key)?.contextWindow ?? contextInfo?.contextWindow ?? 32768;
  }

  function syncContextWindowFromSelect() {
    const selected = contextInfo?.models?.find((m) => m.key === el.contextModel.value);
    contextWindow = selected?.contextWindow ?? contextInfo?.contextWindow ?? 32768;
    updateSettingsHint();
  }

  async function loadSettings() {
    const data = await api("GET", "/api/settings");
    compaction = data.compaction;
    contextInfo = data.context ?? null;
    const saved = localStorage.getItem("pi-persona-context-model");
    populateContextModels(saved || contextInfo?.model);
    el.reserveTokens.value = compaction.reserveTokens;
    el.keepRecentTokens.value = compaction.keepRecentTokens;
    el.compactionEnabled.checked = compaction.enabled !== false;
    updateSettingsHint();
  }

  async function saveCompaction() {
    const reserve = Number(el.reserveTokens.value);
    const keep = Number(el.keepRecentTokens.value);
    if (!Number.isInteger(reserve) || reserve < 0 || !Number.isInteger(keep) || keep < 0) {
      setSettingsMsg("两个阈值都必须是 0 或正整数", "err");
      return;
    }
    try {
      const data = await api("POST", "/api/settings", {
        enabled: el.compactionEnabled.checked,
        reserveTokens: reserve,
        keepRecentTokens: keep,
      });
      compaction = data.compaction;
      setSettingsMsg("已保存。重启 pi-web 后生效。", "ok");
      updateSettingsHint();
    } catch (e) {
      setSettingsMsg(e.message, "err");
    }
  }

  function resetCompaction() {
    el.reserveTokens.value = 16384;
    el.keepRecentTokens.value = 20000;
    el.compactionEnabled.checked = true;
    localStorage.removeItem("pi-persona-context-model");
    populateContextModels(contextInfo?.model);
    updateSettingsHint();
    setSettingsMsg("已恢复默认值，点“保存阈值”写入。", "");
  }

  function activePersona() {
    if (!state?.active?.enabled) return null;
    return state.personas.find((p) => p.id === state.active.id) || null;
  }

  function render() {
    if (!state) return;
    el.ver.textContent = `v${state.version || ""}`;
    el.dir.textContent = state.dir || "-";
    const active = activePersona();
    el.badge.className = `badge ${active ? "on" : "off"}`;
    el.badge.textContent = active ? "已启用" : "未启用";
    el.statusText.textContent = active ? `${active.name}（${active.id}）` : "选择一个人格并点启用";

    el.personas.innerHTML = "";
    if (!state.personas.length) {
      const empty = document.createElement("div");
      empty.className = "hint";
      empty.textContent = "还没有人格，点右上角“新建”创建。";
      el.personas.appendChild(empty);
    }
    for (const p of state.personas) {
      const card = document.createElement("div");
      card.className = `card${p.id === selectedId ? " sel" : ""}`;
      card.dataset.id = p.id;
      card.innerHTML = `
        <div class="row1">
          <span class="name"></span>
          ${p.active ? '<span class="pill">启用中</span>' : ""}
        </div>
        <div class="id">${p.id} · ${p.chars} 字符 · 约 ${p.tokens} tokens</div>`;
      card.querySelector(".name").textContent = p.name;
      card.addEventListener("click", () => select(p.id));
      el.personas.appendChild(card);
    }

    const current = state.personas.find((p) => p.id === selectedId);
    const isActive = !!(state.active.enabled && state.active.id === selectedId);
    el.enableBtn.disabled = !current || busy;
    el.enableBtn.textContent = isActive ? "停用" : "启用";
    el.enableBtn.className = isActive ? "" : "primary";
    el.saveBtn.disabled = !current || busy;
    el.deleteBtn.disabled = !current || busy || isActive;
  }

  async function refreshState(reloadEditor = false) {
    state = await api("GET", "/api/state");
    if (!state.personas.some((p) => p.id === selectedId)) {
      selectedId = state.personas[0]?.id || null;
      dirty = false;
    }
    render();
    if (selectedId && (reloadEditor || !el.content.value)) await loadEditor(selectedId, true);
  }

  async function loadEditor(id, force = false) {
    if (!force && dirty && !confirm("当前编辑未保存，切换会丢失。继续？")) return;
    const data = await api("GET", `/api/persona?id=${encodeURIComponent(id)}`);
    selectedId = id;
    el.content.value = data.content;
    dirty = false;
    el.content.disabled = false;
    el.edTitle.textContent = state?.personas.find((p) => p.id === id)?.name || id;
    el.edSub.textContent = `${id} · 修改后点保存`;
    updateCount();
    render();
  }

  async function select(id) {
    if (id === selectedId) return;
    await loadEditor(id, false);
    setMsg("");
  }

  async function save() {
    if (!selectedId) return;
    busy = true; render();
    try {
      state = await api("POST", "/api/persona", { id: selectedId, content: el.content.value });
      dirty = false;
      const isActive = state.active.enabled && state.active.id === selectedId;
      setMsg(isActive ? "已保存；下一条消息生效" : "已保存", "ok");
      render();
    } catch (e) {
      setMsg(e.message, "err");
    } finally {
      busy = false; render();
    }
  }

  async function toggleActive() {
    if (!state || !selectedId) return;
    busy = true; render();
    try {
      const isActive = state.active.enabled && state.active.id === selectedId;
      state = await api("POST", "/api/active", { id: selectedId, enabled: !isActive });
      setMsg(isActive ? "已停用；下一条消息恢复默认" : "已启用；下一条消息生效", "ok");
      render();
    } catch (e) {
      setMsg(e.message, "err");
    } finally {
      busy = false; render();
    }
  }

  async function create() {
    const id = prompt("人格 ID（字母/数字/_/-，例如 aqi）", "");
    if (!id) return;
    const name = prompt("显示名称", id) || id;
    busy = true;
    try {
      state = await api("POST", "/api/create", { id: id.trim(), name: name.trim() });
      selectedId = id.trim();
      await loadEditor(selectedId, true);
      setMsg("已创建，写点内容再保存", "ok");
      render();
    } catch (e) {
      setMsg(e.message, "err");
    } finally {
      busy = false; render();
    }
  }

  async function remove() {
    if (!selectedId) return;
    if (!confirm(`删除人格 “${selectedId}”？此操作不可撤销。`)) return;
    busy = true; render();
    try {
      state = await api("POST", "/api/delete", { id: selectedId });
      selectedId = null;
      await refreshState(true);
      setMsg("已删除", "ok");
    } catch (e) {
      setMsg(e.message, "err");
    } finally {
      busy = false; render();
    }
  }

  el.content.addEventListener("input", () => {
    dirty = true;
    updateCount();
    setMsg("未保存");
  });
  $("refresh").addEventListener("click", () => {
    refreshState(false).catch((e) => setMsg(e.message, "err"));
    loadSettings().catch((e) => setSettingsMsg(e.message, "err"));
  });
  $("newBtn").addEventListener("click", create);
  el.enableBtn.addEventListener("click", toggleActive);
  el.saveBtn.addEventListener("click", save);
  el.deleteBtn.addEventListener("click", remove);
  el.reserveTokens.addEventListener("input", updateSettingsHint);
  el.keepRecentTokens.addEventListener("input", updateSettingsHint);
  el.saveSettings.addEventListener("click", saveCompaction);
  el.resetSettings.addEventListener("click", resetCompaction);
  el.contextModel.addEventListener("change", () => {
    localStorage.setItem("pi-persona-context-model", el.contextModel.value);
    syncContextWindowFromSelect();
    setSettingsMsg("估算窗口已切换；不会改动实际模型。", "");
  });

  refreshState(true).catch((e) => setMsg(e.message, "err"));
  loadSettings().catch((e) => setSettingsMsg(e.message, "err"));
  setInterval(async () => {
    if (busy) return;
    try {
      state = await api("GET", "/api/state");
      render();
    } catch {}
  }, 4000);
})();
</script>
</body>
</html>
